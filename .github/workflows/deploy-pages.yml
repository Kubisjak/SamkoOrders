name: Deploy to GitHub Pages

# The app is plain static files, so "building" is just uploading the repo.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the icons match tools/make_icons.py
        run: python3 tools/make_icons.py --check

      # Pages has to be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions). The action's `enablement: true` cannot do it for us --
      # creating the site needs admin rights the workflow token does not have.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
