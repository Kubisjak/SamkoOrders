<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Samkova reštaurácia</title>
  <!-- viewport-fit=cover + user-scalable=no: full-bleed on iPad, and a double
       tap on a food tile adds a second portion instead of zooming the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="description" content="A play-restaurant order pad for kids: tap the food, send the order, cook it in the kitchen.">
  <meta name="theme-color" content="#ff8a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Samko">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar__title"><span aria-hidden="true">🍽️</span> <span data-i18n="appName">Samkova reštaurácia</span></h1>
      <!-- Grown-up controls. None of these are Samko's, so they fold away
           behind one button instead of sitting on every screen. -->
      <div class="topbar__actions">
        <button class="iconbtn" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">
          <span class="iconbtn__glyph" aria-hidden="true">⚙️</span>
        </button>
        <div class="settings" id="settings" hidden>
          <button class="settings__item" id="sound-toggle" type="button" aria-pressed="true">
            <span class="iconbtn__glyph" id="sound-glyph" aria-hidden="true">🔊</span>
            <span id="sound-label">Zvuk</span>
          </button>
          <button class="settings__item" id="lang-toggle" type="button">
            <span class="iconbtn__glyph" id="lang-glyph" aria-hidden="true">🇸🇰</span>
            <span data-i18n="language">Jazyk</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ORDER VIEW — the menu now has the screen to itself; the order lives in
         the basket bar underneath. -->
    <main class="view view--order" id="view-order">
      <section class="menu" aria-label="Menu">
        <div class="cats" id="cats" role="tablist"></div>
        <div class="foods" id="foods"></div>

        <!-- Ice cream counter: shown instead of the food grid for that category -->
        <div class="builder" id="builder" hidden>
          <div class="builder__stage">
            <div class="builder__cone" id="builder-cone"></div>
            <!-- The cone drawing already shows which vessel is chosen, so the
                 chooser itself stays rolled up until it is wanted. -->
            <div class="vesselpick">
              <button class="tablepick" id="vessel-toggle" type="button" aria-expanded="false"></button>
              <div class="vessels" id="vessels" role="radiogroup" aria-label="Cone or cup" hidden></div>
            </div>
            <button class="builder__remove" id="builder-undo" type="button" hidden>
              <span class="builder__remove-glyph" aria-hidden="true">🥄</span>
              <span data-i18n="undoScoop">Zlož guľu</span>
            </button>
          </div>
          <div class="builder__panel">
            <p class="builder__label">
              <span data-i18n="pickFlavour">Aké príchute?</span>
              <span class="builder__count" id="builder-count"></span>
            </p>
            <div class="flavours" id="flavours"></div>
            <button class="btn btn--send builder__add" id="builder-add" type="button">
              <span aria-hidden="true">🍦</span>
              <span data-i18n="addToOrder">Pridať do objednávky</span>
              <span class="builder__price" id="builder-price"></span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- KITCHEN VIEW -->
    <main class="view view--kitchen" id="view-kitchen" hidden>
      <div class="kitchen__head">
        <h2 class="kitchen__title"><span aria-hidden="true">👨‍🍳</span> <span data-i18n="tabKitchen">Kuchyňa</span></h2>
        <button class="btn btn--ghost btn--small" id="clear-orders" type="button" data-i18n="clearAll">Zmazať všetko</button>
      </div>
      <p class="kitchen__empty" id="kitchen-empty" data-i18n="noOrders">Zatiaľ žiadne objednávky.</p>
      <div class="orders" id="orders"></div>
    </main>

    <!-- BASKET BAR — the order as a row of pictures, always visible, never in
         the way. Tapping it opens the full ticket. -->
    <div class="basket" id="basket">
      <button class="basket__strip" id="basket-strip" type="button">
        <span class="basket__items" id="basket-items"></span>
        <span class="basket__hint" id="basket-hint" data-i18n="emptyOrder">Klikni na jedlo!</span>
      </button>
      <div class="basket__total">
        <span id="ticket-total">0</span> <span aria-hidden="true">🪙</span>
      </div>
      <button class="btn btn--send basket__send" id="send-draft" type="button">
        <span aria-hidden="true">👨‍🍳</span>
        <span class="basket__send-label" data-i18n="send">Poslať do kuchyne</span>
      </button>
    </div>

    <nav class="tabbar">
      <button class="tab is-active" id="tab-order" type="button" data-view="order">
        <span class="tab__glyph" aria-hidden="true">🧾</span>
        <span class="tab__label" data-i18n="tabOrder">Objednávka</span>
      </button>
      <button class="tab" id="tab-kitchen" type="button" data-view="kitchen">
        <span class="tab__icon">
          <span class="tab__glyph" aria-hidden="true">👨‍🍳</span>
          <span class="tab__badge" id="kitchen-badge" hidden>0</span>
        </span>
        <span class="tab__label" data-i18n="tabKitchen">Kuchyňa</span>
      </button>
    </nav>
  </div>

  <!-- The full ticket, opened from the basket bar -->
  <div class="modal" id="basket-modal" hidden>
    <div class="modal__backdrop" id="basket-backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <div class="ticket">
        <h2 class="ticket__title">
          <span aria-hidden="true">🧾</span>
          <span data-i18n="yourOrder">Objednávka</span>
          <button class="tablepick" id="table-toggle" type="button" aria-expanded="false"></button>
        </h2>
        <div class="tables" id="tables" role="radiogroup" aria-label="Table" hidden></div>
        <ul class="ticket__lines" id="ticket-lines"></ul>
        <p class="ticket__empty" id="ticket-empty" data-i18n="emptyOrder">Klikni na jedlo a pridaj ho sem!</p>
        <div class="ticket__footer">
          <div class="ticket__total">
            <span data-i18n="total">Spolu</span>
            <strong><span id="sheet-total">0</span> <span aria-hidden="true">🪙</span></strong>
          </div>
          <div class="ticket__buttons">
            <button class="btn btn--ghost" id="clear-draft" type="button" data-i18n="clear">Vymazať</button>
            <button class="btn btn--send" id="sheet-send" type="button">
              <span aria-hidden="true">👨‍🍳</span> <span data-i18n="send">Poslať do kuchyne</span>
            </button>
          </div>
        </div>
      </div>
      <button class="btn btn--ghost btn--wide" id="basket-close" type="button" data-i18n="done">Hotovo</button>
    </div>
  </div>

  <!-- PAY: receipt + card terminal -->
  <div class="modal" id="pay-modal" hidden>
    <div class="modal__backdrop" id="pay-backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="receipt-name">

      <div class="receipt">
        <div class="receipt__head">
          <div class="receipt__logo" aria-hidden="true">🍽️</div>
          <div class="receipt__name" id="receipt-name">Samkova reštaurácia</div>
          <div class="receipt__meta">
            <span id="receipt-ticket"></span> · <span id="receipt-table"></span>
          </div>
        </div>
        <ul class="receipt__lines" id="receipt-lines"></ul>
        <div class="receipt__total">
          <span data-i18n="total">Spolu</span>
          <strong><span id="receipt-total">0</span> <span aria-hidden="true">🪙</span></strong>
        </div>
        <div class="receipt__stamp" id="receipt-stamp" hidden data-i18n="paid">Zaplatené</div>
      </div>

      <div class="terminal">
        <div class="terminal__screen">
          <div class="terminal__amount" id="terminal-amount">0</div>
          <div class="terminal__msg" id="terminal-msg" role="status" aria-live="polite"></div>
        </div>
        <div class="terminal__card" id="terminal-card" aria-hidden="true">💳</div>
        <div class="terminal__buttons" id="terminal-buttons">
          <button class="btn btn--pay" id="pay-card" type="button">
            <span aria-hidden="true">💳</span> <span data-i18n="payCard">Kartou</span>
          </button>
          <button class="btn btn--pay btn--cash" id="pay-cash" type="button">
            <span aria-hidden="true">💵</span> <span data-i18n="payCash">Hotovosť</span>
          </button>
        </div>
      </div>

      <button class="btn btn--ghost btn--wide" id="pay-close" type="button" data-i18n="payLater">Zaplatiť neskôr</button>
    </div>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="js/menu.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
